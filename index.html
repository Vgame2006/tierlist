<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161c"><title>GameTL</title>
<style>
:root{--bg:#14161c;--card:#232733;--tx:#f2f3f7;--mu:#8b90a0;--ac:#6c8cff;--t:80px}
#home.on{display:flex;align-items:center;justify-content:center}
.hm{width:100%;max-width:340px;text-align:center}.hm .big{text-align:center}
.sws{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sw{display:flex;align-items:center;gap:10px;padding:14px;font-weight:600}.sw i{width:22px;height:22px;border-radius:50%;display:inline-block}
.view{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}.view.on{display:flex}
.vc{width:min(92vw,520px);aspect-ratio:1;background:#444 center/cover;border-radius:18px;position:relative;overflow:hidden}
.vc span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:26px;font-weight:800;color:#fff;background:rgba(0,0,0,.35);text-shadow:0 2px 6px #000;padding:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
.scr{display:none;padding:14px;max-width:700px;margin:auto;min-height:100vh}.scr.on{display:block}
h1{margin:8px 0 16px}button{font:inherit;color:inherit;border:0;border-radius:12px;background:var(--card);padding:12px 16px}
.pr{background:var(--ac);color:#fff}.big{display:block;width:100%;margin:8px 0;padding:16px;text-align:left;font-weight:600}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:44px;height:44px;padding:0;font-size:20px}
.cont{display:flex;gap:12px;align-items:center;width:100%;padding:10px;text-align:left;margin-bottom:12px}
.mini{width:110px;flex:none;border-radius:6px;overflow:hidden;background:#000}
.mr{display:flex;height:16px}.ml{width:16px}.mi{width:16px;height:16px;background-size:cover}
.row{display:flex;margin-bottom:3px;min-height:var(--t)}
.lab{width:70px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;text-align:center;color:#000;padding:2px;word-break:break-word;font-size:15px}
.cell{flex:1;display:flex;flex-wrap:wrap;background:var(--card);align-content:flex-start;min-height:var(--t)}
.tray{margin-top:18px;border:2px dashed var(--mu);border-radius:12px;display:flex;flex-wrap:wrap;min-height:calc(var(--t) + 8px);padding:4px;gap:0}
.tile{width:var(--t);height:var(--t);background-size:cover;background-position:center;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;background-color:#444;overflow:hidden}
.tile span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);text-shadow:0 1px 3px #000;padding:3px;line-height:1.1}
.tile i{position:absolute;top:0;right:0;background:#e33;color:#fff;font-style:normal;width:22px;height:22px;text-align:center;z-index:2}
.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.85;transform:scale(1.1)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;padding:14px;overflow:auto}.sheet.on{display:block}
input[type=text],input:not([type]){width:100%;padding:12px;border-radius:12px;border:1px solid var(--mu);background:var(--card);color:var(--tx);font:inherit}
.res{height:90px;margin:8px 0;border-radius:12px;background-size:cover;background-position:center;display:flex;align-items:flex-end;font-weight:700;color:#fff;cursor:pointer}
.res span{width:100%;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85));border-radius:0 0 12px 12px}
.er{display:flex;gap:6px;align-items:center;margin:6px 0}.er input[type=color]{width:44px;height:40px;padding:0;border:0;flex:none}
.er input:not([type=color]){flex:1;min-width:0}.er button{padding:8px 10px}
.li{display:flex;gap:10px;align-items:center;margin:8px 0}.li .cont{margin:0;flex:1}
label{display:block;margin:14px 0 6px;color:var(--mu)}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ig div{aspect-ratio:1;background:#444 center/cover;border-radius:10px}</style></head><body>
<div id="home" class="scr on"></div><div id="lists" class="scr"></div><div id="set" class="scr"></div><div id="ed" class="scr"></div>
<div id="srch" class="sheet"></div><div id="cfg" class="sheet"></div><div id="exp" class="sheet"></div><div id="edt" class="sheet"></div><div id="isr" class="sheet"></div><input type="file" id="pf" accept="image/*" hidden><div id="view" class="view"></div>
<input type="file" id="imp" accept=".json,.tier" hidden>
<script>
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const COL=[['S','#ff7f7f'],['A','#ffbf7f'],['B','#ffdf7f'],['C','#ffff7f'],['D','#bfff7f'],['F','#7fff7f']];
let S={lists:[],last:null,set:{key:'',size:80,theme:'dark'}},cur=null,editMode=false;
try{S=Object.assign(S,JSON.parse(localStorage.getItem('tl')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('tl',JSON.stringify(S))}catch(e){alert('Память заполнена')}};
let scr='home',prev='home';function show(n){scr=n;document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==n));window.scrollTo(0,0);({home,lists,set:settings,ed:editor})[n]()}
const TH={midnight:['#14161c','#232733','#f2f3f7','#8b90a0','#5b7cff','Ночь'],light:['#f0f1f5','#ffffff','#14161c','#667085','#4f6bff','Светлая'],violet:['#1a1230','#2a1d4a','#f4eeff','#a99bd0','#8e4dff','Фиолетовая'],forest:['#0f1a14','#1b2e22','#eaf6ee','#86a893','#1fa860','Лес'],crimson:['#1c0f12','#321a20','#fdeef0','#b58a92','#e63e5f','Малиновая'],ocean:['#0a1a24','#12303f','#e8f6fb','#7fa6b6','#1a9fc4','Океан'],sunset:['#1f140d','#36231a','#fff1e6','#bf9a82','#e8791a','Закат'],amoled:['#000000','#161616','#ffffff','#888888','#3d6bff','AMOLED']};
if(!TH[S.set.theme])S.set.theme='midnight';
function applySet(){const t=TH[S.set.theme],r=document.documentElement.style;['--bg','--card','--tx','--mu','--ac'].forEach((k,i)=>r.setProperty(k,t[i]));r.setProperty('--t',S.set.size+'px');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t[0]}
const mini=l=>'<div class="mini">'+l.tiers.map(t=>`<div class="mr"><div class="ml" style="background:${t.color}"></div>${l.items.filter(i=>i.tier==t.id).slice(0,5).map(i=>`<div class="mi" style="background-image:url('${i.img}')"></div>`).join('')}</div>`).join('')+'</div>';
function home(){const l=S.lists.find(x=>x.id==S.last);
$('home').innerHTML='<div class="hm"><h1>🎮 GameTL</h1>'+(l?`<button class="cont" onclick="open_('${l.id}')">${mini(l)}<div><small style="color:var(--mu)">Продолжить</small><br><b>${esc(l.name)}</b></div></button>`:'')+
'<button class="big pr" onclick="create()">➕ Создать</button><button class="big" onclick="show(\'lists\')">📁 Мои тир-листы</button><button class="big" onclick="show(\'set\')">⚙️ Настройки</button></div>'}
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function create(){const n=prompt('Название тир-листа','Мой тир-лист');if(n===null)return;
const l={id:uid(),name:n||'Без названия',tiers:COL.map(c=>({id:uid(),name:c[0],color:c[1]})),items:[],t:Date.now()};S.lists.unshift(l);open_(l.id)}
function open_(id){prev=scr;cur=S.lists.find(x=>x.id==id);S.last=id;editMode=false;save();show('ed')}
function lists(){$('lists').innerHTML=`<div class="bar"><button class="ib" onclick="show('home')">←</button><b>Мои тир-листы</b><button onclick="$('imp').click()">Импорт</button></div>`+
(S.lists.map(l=>`<div class="li"><button class="cont" onclick="open_('${l.id}')">${mini(l)}<b>${esc(l.name)}</b></button><button class="ib" onclick="del('${l.id}')">🗑</button></div>`).join('')||'<p style="color:var(--mu)">Пока пусто</p>')}
function del(id){if(!confirm('Удалить тир-лист?'))return;S.lists=S.lists.filter(l=>l.id!=id);if(S.last==id)S.last=null;save();lists()}
$('imp').onchange=async e=>{try{const l=JSON.parse(await e.target.files[0].text());if(!l.tiers||!l.items)throw 0;l.id=uid();S.lists.unshift(l);save();lists()}catch(x){alert('Неверный файл')}e.target.value=''};
function setTh(k){S.set.theme=k;save();applySet();settings()}
function settings(){const s=S.set;$('set').innerHTML=`<div class="bar"><button class="ib" onclick="show('home')">←</button><b>Настройки</b></div>
<label>Цветовая тема</label><div class="sws">${Object.entries(TH).map(([k,t])=>`<button class="sw" style="background:${t[0]};color:${t[2]};border:3px solid ${s.theme==k?t[4]:t[1]}" onclick="setTh('${k}')"><i style="background:${t[4]}"></i>${t[5]}</button>`).join('')}</div>
<label>Размер плиток: ${s.size}px</label><input type="range" min="56" max="120" value="${s.size}" oninput="S.set.size=+this.value;save();applySet();this.previousElementSibling.textContent='Размер плиток: '+this.value+'px'">
<label>API-ключ RAWG (необязательно; без него поиск идёт через Steam и Wikipedia)</label><input value="${esc(s.key)}" onchange="S.set.key=this.value.trim();save()" placeholder="вставьте ключ">
<label>Данные</label><button onclick="if(confirm('Удалить ВСЕ тир-листы?')){S.lists=[];S.last=null;save();alert('Готово')}">Удалить все тир-листы</button>`}
function editor(){const l=cur;$('ed').innerHTML=`<div class="bar"><button class="ib" onclick="show('home')">🏠</button><b>${esc(l.name)}</b><button class="ib" onclick="cfg()">✏️</button><button class="ib" onclick="expo()">📤</button></div>`+
l.tiers.map(t=>`<div class="row"><div class="lab" style="background:${t.color}">${esc(t.name)}</div><div class="cell" data-t="${t.id}">${l.items.filter(i=>i.tier==t.id).map(tile).join('')}</div></div>`).join('')+
`<div class="tray" data-t="">${l.items.filter(i=>!i.tier).map(tile).join('')}</div><button class="big pr" style="margin-top:14px;text-align:center" onclick="srch()">🔍 Добавить игру</button>`;setTimeout(ensureImgs,50)}
const tile=i=>`<div class="tile" data-i="${i.id}" style="background-image:url('${i.img||''}')"><span>${esc(i.name)}</span></div>`;
// drag
let g=null;
$('ed').addEventListener('pointerdown',e=>{const t=e.target.closest('.tile');if(!t)return;e.preventDefault();
const r=t.getBoundingClientRect();g={el:t,gh:t.cloneNode(true),dx:e.clientX-r.left,dy:e.clientY-r.top,mv:false,x:e.clientX,y:e.clientY};const gg=g;g.tm=setTimeout(()=>{if(g===gg&&!g.mv){const id=gg.el.dataset.i;g=null;delItem(id)}},600)})
addEventListener('pointermove',e=>{if(!g)return;if(!g.mv&&Math.hypot(e.clientX-g.x,e.clientY-g.y)<6)return;
if(!g.mv){g.mv=true;clearTimeout(g.tm);g.gh.classList.add('ghost');document.body.appendChild(g.gh);g.el.style.opacity=.3}
g.gh.style.left=e.clientX-g.dx+'px';g.gh.style.top=e.clientY-g.dy+'px'})
addEventListener('pointerup',e=>{if(!g)return;const o=g;g=null;o.gh.remove();o.el.style.opacity=1;
clearTimeout(o.tm);if(!o.mv){openV(o.el.dataset.i);return}
const c=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-t]');if(!c||!$('ed').contains(c))return;
const it=cur.items.find(i=>i.id==o.el.dataset.i);cur.items=cur.items.filter(i=>i!=it);it.tier=c.dataset.t;
const sib=[...c.querySelectorAll('.tile')].filter(x=>x!=o.el);let idx=sib.length;
for(let k=0;k<sib.length;k++){const b=sib[k].getBoundingClientRect();if(e.clientY<b.top||(e.clientY<b.bottom&&e.clientX<b.left+b.width/2)){idx=k;break}}
const ref=sib[idx]?cur.items.find(i=>i.id==sib[idx].dataset.i):null;
cur.items.splice(ref?cur.items.indexOf(ref):cur.items.length,0,it);cur.t=Date.now();save();editor()});
// edit tiers
function cfg(){const l=cur;$('cfg').classList.add('on');$('cfg').innerHTML=`<div class="bar"><b>Редактирование</b><button class="pr" onclick="$('cfg').classList.remove('on');editor()">Готово</button></div>
<label>Название тир-листа</label><input value="${esc(l.name)}" oninput="cur.name=this.value;save()"><label>Строки</label>`+
l.tiers.map((t,k)=>`<div class="er"><input type="color" value="${t.color}" onchange="cur.tiers[${k}].color=this.value;save()"><input value="${esc(t.name)}" oninput="cur.tiers[${k}].name=this.value;save()"><button onclick="mv(${k},-1)">↑</button><button onclick="mv(${k},1)">↓</button><button onclick="rm(${k})">🗑</button></div>`).join('')+
'<button class="big" onclick="addT()">➕ Добавить строку</button>'}
function mv(k,d){const a=cur.tiers;if(!a[k+d])return;[a[k],a[k+d]]=[a[k+d],a[k]];save();cfg()}
function rm(k){const t=cur.tiers[k];cur.items.forEach(i=>{if(i.tier==t.id)i.tier=''});cur.tiers.splice(k,1);save();cfg()}
function addT(){cur.tiers.push({id:uid(),name:'Новая',color:'#cccccc'});save();cfg()}
// search
let tm;function srch(){$('srch').classList.add('on');$('srch').innerHTML=`<div class="bar"><input id="q" placeholder="Название игры" oninput="clearTimeout(tm);tm=setTimeout(find,450)"><button onclick="$('srch').classList.remove('on')">✕</button></div><button class="big" style="text-align:center" onclick="edit(null,$('q').value.trim())">➕ Своя игра (своё фото)</button><div id="rs"></div>`;$('q').focus()}
const enc=encodeURIComponent;
async function rawg(q){const d=await(await fetch(`https://api.rawg.io/api/games?key=${S.set.key}&search=${enc(q)}&page_size=12`)).json();return d.results.map(g=>({name:g.name,img:g.background_image||''}))}
async function steam(q){const d=await(await fetch(`https://store.steampowered.com/api/storesearch/?term=${enc(q)}&l=english&cc=us`)).json();return d.items.slice(0,12).map(i=>({name:i.name,img:`https://cdn.cloudflare.steamstatic.com/steam/apps/${i.id}/header.jpg`}))}
async function wiki(q){const d=await(await fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${enc(q+' video game')}&gsrlimit=12&prop=pageimages&piprop=thumbnail&pithumbsize=400&pilicense=any&format=json&origin=*`)).json();
return Object.values(d.query?.pages||{}).sort((x,y)=>x.index-y.index).map(p=>({name:p.title.replace(/ \(.*video game.*\)$/i,''),img:p.thumbnail?.source||''}))}
async function find(){const q=$('q').value.trim(),r=$('rs');if(!q)return;r.textContent='Поиск…';let L=[];
if(S.set.key)try{L=await rawg(q)}catch(e){}
if(!L.length)try{L=await steam(q)}catch(e){}
if(!L.length)try{L=await wiki(q)}catch(e){}
window.R=L;r.innerHTML=L.length?L.map((g,k)=>`<div class="res" style="background-image:url('${g.img}')" onclick="pick(${k})"><span>${esc(g.name)}</span></div>`).join(''):'Ничего не найдено или нет интернета'}
function small(u){return new Promise(res=>{if(!u)return res('');const im=new Image;im.crossOrigin='anonymous';im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=300;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,300,300);res(c.toDataURL('image/jpeg',.75))}catch(e){res(u)}};im.onerror=()=>res(u);im.src=u})}
async function pick(k){const g=R[k];$('srch').classList.remove('on');let im=g.img;if(!im)try{im=(await imgSearch(g.name))[0]?.img||''}catch(e){}
cur.items.push({id:uid(),name:g.name,img:await small(im),tier:''});save();editor()}
// export
function expo(){$('exp').classList.add('on');$('exp').innerHTML=`<div class="bar"><b>Экспорт</b><button onclick="$('exp').classList.remove('on')">✕</button></div><button class="big pr" onclick="png()">🖼 Как картинка (PNG)</button><button class="big" onclick="fileEx()">📄 Как файл для импорта</button>`}
async function out(blob,name){const C=window.Capacitor;
if(C&&C.isNativePlatform&&C.isNativePlatform()){try{const b64=await new Promise(r=>{const f=new FileReader;f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
const P=C.Plugins,w=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await P.Share.share({title:name,url:w.uri});return}catch(e){}}
const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}}
function fileEx(){out(new Blob([JSON.stringify(cur)],{type:'application/json'}),cur.name+'.json')}
async function png(noimg){const T=100,W=900,P=100,pr=Math.floor((W-P)/T);const rows=cur.tiers.map(t=>({t,it:cur.items.filter(i=>i.tier==t.id)}));
const hs=rows.map(r=>Math.max(1,Math.ceil(r.it.length/pr))*T);const c=document.createElement('canvas');c.width=W;c.height=hs.reduce((a,b)=>a+b+3,0);const x=c.getContext('2d');
x.fillStyle='#1a1a1a';x.fillRect(0,0,W,c.height);let y=0;
for(let r=0;r<rows.length;r++){x.fillStyle=rows[r].t.color;x.fillRect(0,y,P,hs[r]);x.fillStyle='#000';x.font='bold 28px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(rows[r].t.name,P/2,y+hs[r]/2,P-10);
for(let k=0;k<rows[r].it.length;k++){const i=rows[r].it[k],px=P+(k%pr)*T,py=y+Math.floor(k/pr)*T;x.fillStyle='#444';x.fillRect(px,py,T,T);
if(!noimg&&i.img){await new Promise(res=>{const im=new Image;im.crossOrigin='anonymous';im.onload=()=>{x.drawImage(im,px,py,T,T);res()};im.onerror=res;im.src=i.img})}
x.fillStyle='rgba(0,0,0,.4)';x.fillRect(px,py,T,T);x.fillStyle='#fff';x.font='bold 13px sans-serif';x.fillText(i.name.slice(0,22),px+T/2,py+T/2,T-8)}y+=hs[r]+3}
c.toBlob(b=>{if(b)out(b,cur.name+'.png');else if(!noimg)png(true)},'image/png')}
async function imgSearch(q){const J=async u=>(await fetch(u)).json(),W='https://en.wikipedia.org/w/api.php?format=json&origin=*&action=query&';
const pg=d=>Object.values(d.query?.pages||{}).sort((a,b)=>a.index-b.index),fl=d=>pg(d).map(p=>p.imageinfo?.[0]?.thumburl);
const jobs=[steam(q).then(a=>a.map(x=>x.img)),
J(W+`generator=search&gsrsearch=${enc(q+' video game')}&gsrlimit=8&prop=pageimages&piprop=thumbnail&pithumbsize=400&pilicense=any`).then(d=>pg(d).map(p=>p.thumbnail?.source)),
J(W+`generator=search&gsrsearch=${enc(q+' cover')}&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url&iiurlwidth=400`).then(fl),
J(`https://commons.wikimedia.org/w/api.php?format=json&origin=*&action=query&generator=search&gsrsearch=${enc(q)}&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url&iiurlwidth=400`).then(fl)];
const out=[];for(const r of await Promise.allSettled(jobs))if(r.status=='fulfilled')for(const u of r.value)if(u&&!out.some(o=>o.img==u))out.push({img:u});return out}
let busy=0;async function ensureImgs(){if(busy||!navigator.onLine)return;busy=1;const L=cur;let ch=false;
for(const i of L.items){if(i.img||i.tried)continue;try{const r=await imgSearch(i.name);i.tried=1;if(r[0]){i.img=await small(r[0].img);ch=true}}catch(e){}}
busy=0;if(ch){save();if(scr=='ed'&&cur==L&&!g)editor()}}
let E=null;function edit(id,nm){const i=id?cur.items.find(x=>x.id==id):null;E={id:id||null,name:i?i.name:(nm||''),img:i?i.img:''};drawE()}
function drawE(){$('edt').classList.add('on');$('edt').innerHTML=`<div class="bar"><b>${E.id?'Изменить игру':'Своя игра'}</b><button class="ib" onclick="$('edt').classList.remove('on')">✕</button></div>
<div class="vc" style="width:min(70vw,300px);margin:6px auto 14px;background-image:url('${E.img}')"><span id="ept">${esc(E.name)}</span></div>
<label>Название</label><input value="${esc(E.name)}" oninput="E.name=this.value;$('ept').textContent=this.value">
<label>Картинка</label><button class="big" onclick="$('pf').click()">📁 Выбрать из файлов</button><button class="big" onclick="imgSheet()">🔍 Найти в интернете</button><button class="big pr" style="text-align:center;margin-top:18px" onclick="saveE()">Сохранить</button>`}
$('pf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader;r.onload=async()=>{E.img=await small(r.result);drawE()};r.readAsDataURL(f)};
let it;function imgSheet(){$('isr').classList.add('on');$('isr').innerHTML=`<div class="bar"><input id="iq" value="${esc(E.name)}" oninput="clearTimeout(it);it=setTimeout(imgFind,450)"><button onclick="$('isr').classList.remove('on')">✕</button></div><div id="ir" class="ig"></div>`;imgFind()}
async function imgFind(){const q=$('iq').value.trim(),r=$('ir');if(!q)return;r.textContent='Поиск…';let L=[];try{L=await imgSearch(q)}catch(e){}window.IR=L;r.innerHTML=L.length?L.map((x,k)=>`<div style="background-image:url('${x.img}')" onclick="pickImg(${k})"></div>`).join(''):'Ничего не найдено'}
async function pickImg(k){E.img=await small(IR[k].img);$('isr').classList.remove('on');drawE()}
function saveE(){const n=E.name.trim();if(!n)return alert('Введите название');
if(E.id){const i=cur.items.find(x=>x.id==E.id);i.name=n;i.img=E.img;i.tried=1}else cur.items.push({id:uid(),name:n,img:E.img,tier:''});
save();['edt','srch'].forEach(x=>$(x).classList.remove('on'));closeV();editor()}
function openV(id){const i=cur.items.find(x=>x.id==id);if(!i)return;const t=cur.tiers.find(x=>x.id==i.tier);
$('view').innerHTML=`<div class="vc" style="background-image:url('${i.img}')"><span>${esc(i.name)}</span></div><div style="color:#fff">${t?'Ряд: '+esc(t.name):'Не в тир-листе'}</div><div class="er" style="width:min(92vw,520px)"><button style="flex:1" onclick="closeV()">Закрыть</button><button style="flex:1" onclick="closeV();edit('${id}')">✏️ Изменить</button><button style="flex:1;background:#d33;color:#fff" onclick="delItem('${id}')">🗑</button></div>`;$('view').classList.add('on')}
function closeV(){$('view').classList.remove('on')}
function delItem(id){const i=cur.items.find(x=>x.id==id);if(!i||!confirm('Удалить «'+i.name+'»?'))return;cur.items=cur.items.filter(x=>x!=i);save();closeV();editor()}
$('view').onclick=e=>{if(e.target.id=='view')closeV()};
addEventListener('contextmenu',e=>e.preventDefault());
function back(){if($('view').classList.contains('on'))return closeV();
if($('cfg').classList.contains('on')){$('cfg').classList.remove('on');return editor()}
for(const id of['isr','edt','srch','exp'])if($(id).classList.contains('on')){$(id).classList.remove('on');return}
if(scr=='ed')return show(prev=='lists'?'lists':'home');
if(scr!='home')return show('home');
try{window.Capacitor.Plugins.App.exitApp()}catch(e){}}
try{window.Capacitor.Plugins.App.addListener('backButton',back)}catch(e){}
applySet();home();
</script></body></html>
