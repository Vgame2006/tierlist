name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp index.html www/index.html && sed -i "s/const BUILD=0;/const BUILD=${{ github.run_number }};/" www/index.html
      - run: pip install pillow && python3 make_icon.py
      - run: npm install
      - run: npx cap add android
      - run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Signing key
        env:
          KS: ${{ secrets.KS_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: GameTL v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
